<!DOCTYPE html>
<html lang="ko">
<head>

    <title>메.추.리.알 - 메뉴 추천 리얼 알리미</title>
    <meta name="description" content="냉장고 속 재료로 만드는 맛있는 레시피 추천 서비스">

    <style>

        body {

            background-color: #fffdf0;
        }

        .egg-gradient {
            background: linear-gradient(135deg, #ffecb3 0%, #ffd54f 100%);
        }

        .recipe-card {

        }

        }

        .category-pill.active {
            background-color: #f59e0b;
            color: white;
        }

        .ingredient-tag {

<body class="min-h-screen pb-20">

    <!-- Header -->

    </header>

    <main class="max-w-4xl mx-auto p-4">
        
        <!-- Search & Filter Section -->
        <section class="bg-white rounded-2xl p-5 shadow-sm mb-6 border border-amber-100">
            <div class="relative mb-4">

            </div>
        </section>

        <!-- Stats -->
        <div class="px-2 mb-4 text-amber-900 font-bold">

        </div>

        <div id="recipeList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Recipes will be injected here -->
        </div>
    </main>

            <div class="egg-gradient p-6 relative">

                </button>

                <div class="flex gap-4 mt-3 text-sm text-amber-800">
                    <span><i class="fa-regular fa-clock mr-1"></i> <span id="modalTime">15분</span></span>
                </div>
            </div>
            <div class="p-6 overflow-y-auto">
                <div class="mb-6">
                    <h3 class="font-bold text-amber-900 mb-2 flex items-center">
                        <i class="fa-solid fa-basket-shopping mr-2 text-amber-500"></i> 준비 재료

                </div>

                <div class="bg-amber-50 p-4 rounded-xl border border-amber-100">

                    </h3>

                </div>
            </div>
        </div>
    </div>

                name: "가지나물",
                ingredients: "가지, 간장, 마늘, 파, 참기름, 고춧가루",
                method: "1. 가지를 쪄서 먹기 좋은 크기로 찢는다.\n2. 간장, 마늘, 파, 참기름, 고춧가루를 섞어 양념을 만든다.\n3. 가지와 양념을 살살 버무린다.",
                category: "나물/무침",
                time: "15분",
                tip: "가지를 너무 오래 찌면 흐물거릴 수 있으니 5분 정도가 적당합니다."
            },
            {
                name: "제육볶음",
                ingredients: "돼지고기, 고추장, 고춧가루, 간장, 설탕, 마늘, 양파, 파",
                method: "1. 돼지고기를 양념장에 미리 재워둔다.\n2. 팬을 달궈 고기를 볶다가 야채를 넣고 함께 볶는다.\n3. 고기가 다 익으면 불을 끄고 깨를 뿌린다.",
                category: "반찬",
                time: "30분",
                tip: "고기를 센 불에서 빠르게 볶아야 육즙이 빠지지 않습니다."
            },
            {
                name: "콩자반",
                ingredients: "검은콩, 간장, 설탕, 물, 올리고당, 깨",
                method: "1. 콩을 깨끗이 씻어 물에 충분히 불린다.\n2. 냄비에 콩과 물을 넣고 끓이다가 간장과 설탕을 넣는다.\n3. 국물이 거의 졸아들면 올리고당을 넣고 윤기를 낸다.",
                category: "반찬",
                time: "40분",
                tip: "콩을 충분히 불려야 딱딱하지 않은 콩자반이 됩니다."
            },
            {
                name: "부추무침",
                ingredients: "부추, 양파, 고춧가루, 간장, 식초, 설탕",
                method: "1. 부추를 5cm 길이로 썰고 양파는 얇게 채 썬다.\n2. 양념장을 만들어 부추, 양파와 함께 살살 버무린다.\n3. 고기 요리와 함께 곁들여 낸다.",
                category: "나물/무침",
                time: "5분",
                tip: "너무 세게 무치면 풋내가 날 수 있으니 가볍게 섞어주세요."
            },
            {
                name: "잡채",
                ingredients: "당면, 시금치, 돼지고기, 당근, 버섯, 양파, 간장, 설탕, 참기름",
                method: "1. 당면은 삶아서 찬물에 헹군다.\n2. 야채와 고기를 각각 따로 볶아 준비한다.\n3. 당면과 모든 재료를 넣고 간장 양념에 버무려 살짝 볶는다.",
                category: "반찬",
                time: "50분",
                tip: "재료를 따로 볶아야 각각의 색과 맛이 살아납니다."
            }
        ];

        let currentCategory = "전체";
        let searchTerm = "";

        const recipeList = document.getElementById('recipeList');
        const searchInput = document.getElementById('searchInput');
        const categoryContainer = document.getElementById('categoryContainer');
        const recipeCount = document.getElementById('recipeCount');

        function init() {
            renderCategories();
            renderRecipes();
            
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value.toLowerCase();
                renderRecipes();
            });
        }

        function renderCategories() {
            const categories = ["전체", ...new Set(rawRecipes.map(r => r.category))];
            categoryContainer.innerHTML = categories.map(cat => `
                <button class="category-pill whitespace-nowrap px-4 py-2 rounded-full bg-white text-amber-700 text-sm font-bold border border-amber-100 transition-all ${currentCategory === cat ? 'active' : ''}" 
                    onclick="setCategory('${cat}')">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderRecipes();
        }

        function renderRecipes() {
            const filtered = rawRecipes.filter(r => {
                const matchesCategory = currentCategory === "전체" || r.category === currentCategory;
                const matchesSearch = r.name.toLowerCase().includes(searchTerm) || 
                                    r.ingredients.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            recipeCount.innerText = filtered.length;

            recipeList.innerHTML = filtered.map((r, idx) => `
                <div class="recipe-card bg-white p-5 rounded-2xl shadow-sm border border-amber-50 cursor-pointer" onclick='openModal(${JSON.stringify(r).replace(/'/g, "&apos;")})'>
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-100">${r.category}</span>
                        <span class="text-xs text-gray-400"><i class="fa-regular fa-clock"></i> ${r.time}</span>
                    </div>
                    <h3 class="text-lg font-bold text-gray-800 mb-2">${r.name}</h3>
                    <div class="flex flex-wrap gap-1 mt-3">
                        ${r.ingredients.split(',').slice(0, 3).map(ing => `
                            <span class="text-[11px] ingredient-tag px-2 py-0.5 rounded-md">${ing.trim()}</span>
                        `).join('')}
                        ${r.ingredients.split(',').length > 3 ? `<span class="text-[11px] text-gray-400">...</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function openModal(recipe) {
            document.getElementById('modalTitle').innerText = recipe.name;
            document.getElementById('modalCategory').innerText = recipe.category;
            document.getElementById('modalTime').innerText = recipe.time;
            document.getElementById('modalIngredients').innerText = recipe.ingredients;
            document.getElementById('modalSteps').innerText = recipe.method;
            document.getElementById('modalTip').innerText = recipe.tip;
            
            document.getElementById('recipeModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('recipeModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('recipeModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        init();
    </script>
</body>
</html>
